name: Shattered Realms: Reborn

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    name: Android Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Export Android APK
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          relative_project_path: ./
          presets_to_export: Android
          export_debug: true
          cache: true

      - name: Verify APK
        shell: bash
        run: |
          set -e
          APK="$(find . -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          test -s "$APK"
          echo "APK: $APK"
          ls -lh "$APK"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: shattered-realms-reborn-android-debug
          path: ./**/*.apk
          if-no-files-found: error
          retention-days: 14
