name: Shattered Realms: Reborn

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    name: Godot Android Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.1"

      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -e
          mkdir -p "$HOME/godot"
          curl -L --fail --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d "$HOME/godot"
          GODOT_BIN="$(find "$HOME/godot" -maxdepth 2 -type f -name 'Godot_v4.7.2-stable_linux.x86_64' | head -n 1)"
          test -x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Install matching export templates
        shell: bash
        run: |
          set -e
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          curl -L --fail --retry 3 -o /tmp/templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/godot_templates
          TEMPLATE_DIR="$(find /tmp/godot_templates -type d -name 'templates' | head -n 1)"
          test -n "$TEMPLATE_DIR"
          cp -a "$TEMPLATE_DIR"/. "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
          test -f "$HOME/.local/share/godot/export_templates/4.7.2.stable/android_debug.apk"

      - name: Validate project
        run: "$GODOT_BIN" --headless --path . --editor --quit

      - name: Export Android debug APK
        run: |
          mkdir -p builds
          "$GODOT_BIN" --headless --path . --export-debug "Android" builds/shattered-realms-reborn-debug.apk

      - name: Verify APK
        shell: bash
        run: |
          set -e
          test -s builds/shattered-realms-reborn-debug.apk
          ls -lh builds/shattered-realms-reborn-debug.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: shattered-realms-reborn-android-debug
          path: builds/shattered-realms-reborn-debug.apk
          if-no-files-found: error
          retention-days: 14
