name: Build Shattered Realms: Reborn

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.2"
  GODOT_BIN: "Godot_v4.7.2-stable_linux.x86_64"
  GODOT_URL: "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
  GODOT_TEMPLATES_URL: "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"

jobs:
  validate:
    name: Validate Godot project
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot
        run: |
          curl -L "$GODOT_URL" -o godot.zip
          unzip -q godot.zip
          chmod +x "$GODOT_BIN"

      - name: Validate project
        run: |
          "./$GODOT_BIN" --headless --editor --path . --quit

  android-debug:
    name: Android Debug APK
    runs-on: ubuntu-24.04
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.1.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Download Godot
        run: |
          curl -L "$GODOT_URL" -o godot.zip
          unzip -q godot.zip
          chmod +x "$GODOT_BIN"

      - name: Install Godot export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          curl -L "$GODOT_TEMPLATES_URL" -o templates.tpz
          unzip -q templates.tpz -d templates
          cp -R templates/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/ || true

      - name: Create CI debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkeypair \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -noprompt

      - name: Export Android APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p builds
          "./$GODOT_BIN" --headless --path . --export-debug "Android" builds/shattered-realms-reborn-debug.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: shattered-realms-reborn-android-debug
          path: builds/shattered-realms-reborn-debug.apk
          if-no-files-found: error
          retention-days: 14
