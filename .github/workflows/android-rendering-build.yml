name: Shattered Realms Android Rendering Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.2"
  GODOT_RELEASE: "stable"

jobs:
  android-build:
    name: Android Rendering Proof Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/godot"
          curl -L --fail --retry 3             -o /tmp/godot.zip             "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d "$HOME/godot"
          GODOT_BIN="$HOME/godot/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64"
          test -x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Install Godot export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}"
          curl -L --fail --retry 3             -o /tmp/templates.tpz             "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/godot_templates
          cp -R /tmp/godot_templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}/"

      - name: Verify Godot
        run: |
          set -euo pipefail
          "$GODOT_BIN" --version
          "$GODOT_BIN" --version | grep -F "${GODOT_VERSION}"

      - name: Import project
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path . --import --quit

      - name: Run rendering proof
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path . --quit-after 3

      - name: Export Android debug APK
        run: |
          set -euo pipefail
          mkdir -p builds
          "$GODOT_BIN" --headless --path . --export-debug "Android" builds/shattered-realms-reborn-debug.apk
          test -s builds/shattered-realms-reborn-debug.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: shattered-realms-reborn-rendering-proof-android
          path: builds/shattered-realms-reborn-debug.apk
          if-no-files-found: error
